<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ec" />
    <meta name="description" content="Cairn: work through the NeetCode 150 with spaced revision, pattern drills and a map of the climb." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Cairn</title>
    <script>
      // Apply the theme before first paint so the page never flashes the wrong one.
      ;(function () {
        var choice = null
        try {
          choice = localStorage.getItem('cairn:theme')
        } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#0d1218' : '#f6f3ec')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
